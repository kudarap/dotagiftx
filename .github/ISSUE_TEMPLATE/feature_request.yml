name: Feature request
description: Suggest a new feature or improvement for DotagiftX
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please search existing issues to see
        if this has already been requested.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem or need does this feature address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the feature to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've tried?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, or any other helpful context.
    validations:
      required: false
