name: Bug report
description: Report a bug in DotagiftX
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Before filing,
        please search existing issues to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What steps should we take to see the bug?
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The DotagiftX version (see the `VERSION` file or footer).
      placeholder: v0.25.4
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser/OS for the web app, or OS/Go version for the backend.
      placeholder: |
        - OS: macOS 14
        - Browser: Chrome 126
        - Go: 1.26
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Any logs, screenshots, or error output that might help.
    validations:
      required: false
