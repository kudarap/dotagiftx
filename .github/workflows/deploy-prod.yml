
name: Deploy Production API

permissions:
  contents: read

on:
  push:
    branches: [master]
    tags: ["*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - uses: golangci/golangci-lint-action@v9

      - name: Compile
        run: make build

      - name: Test
        run: make test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version from tag or VERSION file
        id: version
        run: |
          if [[ ! -z "${{ github.ref }}" && "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            if [ -f VERSION ]; then
              echo "VERSION=$(cat VERSION)" >> $GITHUB_ENV
            else
              echo "VERSION=latest" >> $GITHUB_ENV
            fi
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: kudarap/dotagiftx:${{ env.VERSION }},kudarap/dotagiftx:latest
          cache-from: type=registry,ref=kudarap/dotagiftx:buildcache
          cache-to: type=registry,ref=kudarap/dotagiftx:buildcache,mode=max

      - name: SSH Image Deploy
        run: ssh root@chiligarlic.com "cd ~/deployments/dotagiftx/prod && ./restart.sh"