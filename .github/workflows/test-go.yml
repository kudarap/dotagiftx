name: Reusable Go Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - uses: golangci/golangci-lint-action@v9

      - id: govulncheck
        uses: golang/govulncheck-action@v1

      - name: Compile
        run: make build

      - name: Test
        run: make test
