name: Deploy Development API

permissions:
  contents: read

on:
  push:
    branches: [dev, feature/version-tag-image-release]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - uses: golangci/golangci-lint-action@v9

      - name: Compile
        run: make build

      - name: Test
        run: make test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          tags: kudarap/dotagiftx:dev
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=registry,ref=kudarap/dotagiftx:buildcache
          cache-to: type=registry,ref=kudarap/dotagiftx:buildcache,mode=max

      - name: SSH Image Deploy
        run: ssh root@chiligarlic.com "cd ~/deployments/dotagiftx/dev && ./restart.sh"
