name: Testing

permissions:
  contents: read

on:
  push:
  pull_request:
    branches: [feature/*, hotfix/*, release/*]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - uses: golangci/golangci-lint-action@v9

      - id: govulncheck
        uses: golang/govulncheck-action@v1

      - name: Compile
        run: make build

      - name: Test
        run: make test

  test-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Bun test build
        working-directory: web
        run: |
          bun install
          bun run lint
          bun run build
