services:
  rethinkdb:
    image: kudarap/rethinkdb:2.4
    ports:
      - "28015:28015"
      - "28080:8080"
    volumes:
      - ./.localdata/rethinkdb:/data'

  redis:
    image: valkey/valkey:9-1-alpine
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: root
    volumes:
      - ./.localdata/valkey:/data'
